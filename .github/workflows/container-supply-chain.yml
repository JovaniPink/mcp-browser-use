name: Container supply-chain contract

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - renovate.json
      - .github/workflows/**
      - tests/test_container_supply_chain.py
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - renovate.json
      - .github/workflows/**
      - tests/test_container_supply_chain.py

permissions:
  contents: read

jobs:
  contract:
    name: Immutable build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify immutable build inputs
        run: >-
          python -m unittest discover -s tests
          -p 'test_container_supply_chain.py' -v
