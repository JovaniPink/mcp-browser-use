# Smithery local session configuration: https://smithery.ai/docs/build/session-config

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - mcpModelProvider
      - mcpModelName
    allOf:
      - if:
          properties:
            mcpModelProvider:
              not:
                const: ollama
          required:
            - mcpModelProvider
        then:
          required:
            - modelApiKey
    properties:
      modelApiKey:
        type: string
        description: API key for the selected provider. Leave unset only for Ollama.
      modelEndpoint:
        type: string
        description: Optional endpoint override for Anthropic, Azure OpenAI, DeepSeek, Ollama, or OpenAI.
      azureOpenaiDeployment:
        type: string
        description: Azure OpenAI deployment name when that provider is selected.
      azureOpenaiApiVersion:
        type: string
        default: 2024-12-01-preview
        description: Azure OpenAI API version.
      browserUseCdpUrl:
        type: string
        description: Explicit authenticated CDP URL. Leave unset to launch a fresh browser.
      browserUseAllowedDomains:
        type: string
        description: Optional comma-separated navigation allowlist.
      browserUseHeadless:
        type: boolean
        default: true
        description: Launch a fresh browser without a visible window.
      browserUseDisableSecurity:
        type: boolean
        default: false
        description: Disable browser security only for isolated disposable testing.
      chromePath:
        type: string
        description: Optional path to a Chrome or Chromium executable.
      chromeUserData:
        type: string
        description: Optional profile directory used only when persistence is enabled.
      chromePersistentSession:
        type: boolean
        default: false
        description: Reuse the configured Chrome profile between tasks.
      mcpModelProvider:
        type: string
        enum:
          - anthropic
          - azure_openai
          - browser_use
          - deepseek
          - gemini
          - ollama
          - openai
        default: anthropic
        description: Model provider used by browser-use.
      mcpModelName:
        type: string
        default: claude-opus-5
        description: Provider-specific model name.
      mcpTemperature:
        type: number
        minimum: 0
        maximum: 2
        description: Optional sampling temperature. Leave unset for current Anthropic models, which reject sampling parameters.
      mcpMaxSteps:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
        description: Maximum browser-agent steps.
      mcpUseVision:
        type: boolean
        default: true
        description: Allow the model to use browser screenshots.
      mcpMaxActionsPerStep:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
        description: Maximum browser actions in one model step.
      mcpRunTimeoutSeconds:
        type: integer
        minimum: 30
        maximum: 3600
        default: 600
        description: Wall-clock limit for one browser-agent run.
      mcpMaxConcurrentRuns:
        type: integer
        minimum: 1
        maximum: 8
        default: 1
        description: Browser-agent runs (each with its own Chromium) allowed at once.
  commandFunction:
    |-
    (config) => {
      const provider = config.mcpModelProvider || 'anthropic';
      if (provider !== 'ollama' && !config.modelApiKey) {
        throw new Error('modelApiKey is required for non-Ollama providers');
      }
      const keyNames = { anthropic: 'ANTHROPIC_API_KEY', azure_openai: 'AZURE_OPENAI_API_KEY', browser_use: 'BROWSER_USE_API_KEY', deepseek: 'DEEPSEEK_API_KEY', gemini: 'GOOGLE_API_KEY', openai: 'OPENAI_API_KEY' };
      const endpointNames = { anthropic: 'ANTHROPIC_API_ENDPOINT', azure_openai: 'AZURE_OPENAI_ENDPOINT', deepseek: 'DEEPSEEK_ENDPOINT', ollama: 'OLLAMA_HOST', openai: 'OPENAI_ENDPOINT' };
      const env = {
        MCP_MODEL_PROVIDER: provider,
        MCP_MODEL_NAME: config.mcpModelName || 'claude-opus-5',
        MCP_MAX_STEPS: String(config.mcpMaxSteps ?? 30),
        MCP_USE_VISION: String(config.mcpUseVision ?? true),
        MCP_MAX_ACTIONS_PER_STEP: String(config.mcpMaxActionsPerStep ?? 5),
        MCP_RUN_TIMEOUT_SECONDS: String(config.mcpRunTimeoutSeconds ?? 600),
        MCP_MAX_CONCURRENT_RUNS: String(config.mcpMaxConcurrentRuns ?? 1),
        BROWSER_USE_HEADLESS: String(config.browserUseHeadless ?? true),
        BROWSER_USE_DISABLE_SECURITY: String(config.browserUseDisableSecurity ?? false),
        CHROME_PERSISTENT_SESSION: String(config.chromePersistentSession ?? false),
      };
      if (config.mcpTemperature !== undefined) env.MCP_TEMPERATURE = String(config.mcpTemperature);
      if (config.modelApiKey && keyNames[provider]) env[keyNames[provider]] = config.modelApiKey;
      if (config.modelEndpoint && endpointNames[provider]) env[endpointNames[provider]] = config.modelEndpoint;
      if (config.azureOpenaiDeployment) env.AZURE_OPENAI_DEPLOYMENT = config.azureOpenaiDeployment;
      if (config.azureOpenaiApiVersion) env.AZURE_OPENAI_API_VERSION = config.azureOpenaiApiVersion;
      if (config.browserUseCdpUrl) env.BROWSER_USE_CDP_URL = config.browserUseCdpUrl;
      if (config.browserUseAllowedDomains) env.BROWSER_USE_ALLOWED_DOMAINS = config.browserUseAllowedDomains;
      if (config.chromePath) env.CHROME_PATH = config.chromePath;
      if (config.chromeUserData) env.CHROME_USER_DATA = config.chromeUserData;
      return { command: 'uv', args: ['run', '--frozen', 'mcp-browser-use'], env };
    }
